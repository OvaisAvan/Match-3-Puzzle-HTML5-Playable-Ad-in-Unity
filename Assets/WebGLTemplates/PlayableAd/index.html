<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>MatchBlitz — Ad Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
    }

    h1 {
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 12px;
    }

    #canvas-wrap {
      position: relative;
      width: 390px;
      height: 844px;
      max-height: 90vh;
      max-width: 90vw;
      aspect-ratio: 390 / 844;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.35);
      border: 2px solid rgba(139, 92, 246, 0.3);
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #1a1a2e;
    }

    #loading-cover {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      gap: 16px;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(167, 139, 250, 0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar {
      width: 160px; height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      border-radius: 3px;
      transition: width 0.2s ease;
      width: 0%;
    }

    .load-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
    }

    #device-bar {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .device-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(167,139,250,0.3);
      background: transparent;
      color: #a78bfa;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .device-btn:hover { background: rgba(167,139,250,0.15); }
    .device-btn.active { background: rgba(167,139,250,0.25); border-color: #a78bfa; }
  </style>
</head>
<body>

<h1>MatchBlitz — Playable Ad Preview</h1>

<div id="canvas-wrap">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading-cover">
    <div class="spinner"></div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="load-label">Loading playable ad…</div>
  </div>
</div>

<div id="device-bar">
  <button class="device-btn active" onclick="setSize(390,844,this)">iPhone 14</button>
  <button class="device-btn"        onclick="setSize(412,915,this)">Android</button>
  <button class="device-btn"        onclick="setSize(768,1024,this)">iPad</button>
</div>

<script src="{{{ LOADER_FILENAME }}}"></script>
<script>
  var canvas = document.getElementById('unity-canvas');
  var cover  = document.getElementById('loading-cover');
  var fill   = document.getElementById('progress-fill');

  createUnityInstance(canvas, {
    dataUrl:           "{{{ DATA_FILENAME }}}",
    frameworkUrl:      "{{{ FRAMEWORK_FILENAME }}}",
    codeUrl:           "{{{ CODE_FILENAME }}}",
    streamingAssetsUrl:"StreamingAssets",
    companyName:       "YourStudio",
    productName:       "MatchBlitz",
    productVersion:    "1.0",
  }, function(progress) {
    fill.style.width = (progress * 100) + '%';
  }).then(function(instance) {
    window.unityInstance = instance;
    cover.style.opacity = '0';
    setTimeout(() => cover.style.display = 'none', 500);
  }).catch(console.error);

  function setSize(w, h, btn) {
    var wrap = document.getElementById('canvas-wrap');
    wrap.style.width  = w + 'px';
    wrap.style.height = h + 'px';
    document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
</script>
</body>
</html>
